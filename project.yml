name: NowyStart
options:
  bundleIdPrefix: pl.nowystart
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
  defaultConfig: Debug

packages:
  SobrietyCore:
    path: Packages/SobrietyCore

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  NowyStart:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: SobrietyCore
    settings:
      base:
        PRODUCT_NAME: NowyStart
        PRODUCT_BUNDLE_IDENTIFIER: pl.nowystart.app
        INFOPLIST_KEY_CFBundleDisplayName: "Nowy Start"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Aplikacja używa Face ID do zabezpieczenia Twoich osobistych danych przed nieuprawnionym dostępem."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: App/NowyStart.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pl.nowystart.app

  NowyStartWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
    dependencies:
      - package: SobrietyCore
    settings:
      base:
        PRODUCT_NAME: NowyStartWidget
        PRODUCT_BUNDLE_IDENTIFIER: pl.nowystart.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: "Nowy Start Widget"
        INFOPLIST_KEY_NSExtension_PointIdentifier: "com.apple.widgetkit-extension"
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: Widget/NowyStartWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pl.nowystart.app

  NowyStartTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/SobrietyCore/Tests/SobrietyCoreTests
    dependencies:
      - target: NowyStart
      - package: SobrietyCore
    settings:
      base:
        PRODUCT_NAME: NowyStartTests
        PRODUCT_BUNDLE_IDENTIFIER: pl.nowystart.app.tests
        GENERATE_INFOPLIST_FILE: YES
